services:
  auth-api:
    build: .
    env_file:
      - .env
    volumes:
      - jwt_keys_data:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app_network
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.auth-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/auth-back`)
      - traefik.http.routers.auth-api.entrypoints=web
      - traefik.http.routers.auth-api.middlewares=auth-api-strip
      - traefik.http.routers.auth-api-secure.rule=Host(`${DOMAIN}`) && PathPrefix(`/auth-back`)
      - traefik.http.routers.auth-api-secure.entrypoints=websecure
      - traefik.http.routers.auth-api-secure.tls=true
      - traefik.http.routers.auth-api-secure.tls.certresolver=${TLS_RESOLVER:-letsencrypt}
      - traefik.http.routers.auth-api-secure.middlewares=auth-api-strip
      - traefik.http.middlewares.auth-api-strip.stripprefix.prefixes=/auth-back
      - traefik.http.services.auth-api.loadbalancer.server.port=8000

  postgres:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  loki:
    image: grafana/loki:3.0.0
    container_name: lyceum-auth-backend-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.0.0
    container_name: lyceum-auth-backend-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: lyceum-auth-backend-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - loki
    volumes:
      - grafana-data:/var/lib/grafana

  prometheus:
    image: prom/prometheus:latest
    container_name: lyceum-auth-backend-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  postgres_data:
  jwt_keys_data:
  loki-data:
  grafana-data:

networks:
  app_network:
    driver: bridge
  traefik-public:
    external: true
    name: traefik-public
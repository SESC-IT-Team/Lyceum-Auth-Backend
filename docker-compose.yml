services:
  auth-api:
    build: .
    env_file:
      - .env
    volumes:
      - jwt_keys_data:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app_network
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.auth-api.rule=Host(`auth.sesc-it-team.ru`)
      - traefik.http.routers.auth-api.entrypoints=websecure
      - traefik.http.routers.auth-api.tls.certresolver=letsencrypt
      - traefik.http.services.auth-api.loadbalancer.server.port=8000

  postgres:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

volumes:
  postgres_data:
  jwt_keys_data:

networks:
  app_network:
    driver: bridge
  traefik-public:
    external: true
    name: traefik-public
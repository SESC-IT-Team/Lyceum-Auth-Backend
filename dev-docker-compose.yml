services:
  postgres:
    image: postgres:15-alpine
    container_name: lyceum-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lyceum_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lyceum-auth-backend
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "3000:3000"
    labels:
      logging: "promtail"
      service: "lyceum-auth-backend"

volumes:
  postgres-data: